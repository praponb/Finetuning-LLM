# LoRA fine-tune of Qwen2.5-Coder-3B-Instruct (4-bit MLX) on the SQL -> PySpark dataset (v4: + long pipelines,
# advanced Spark SQL and nested data; v2/v3 used the same settings with max_seq_length 1024).
# Run from sql2pyspark-mlx/:   mlx_lm.lora -c lora_config.yaml
model: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit
train: true
fine_tune_type: lora
data: ./data                 # train.jsonl / valid.jsonl / test.jsonl from convert_sql_pyspark.py
adapter_path: ./adapters
seed: 0

# v4: 1,200 optimizer updates of 4 samples (like v2/v3), done as 2,400 micro-batches of 2 with gradient
# accumulation: 4 x ~2.7k-token samples do not fit in the ~10.7 GB of GPU memory a 16 GB Mac allows, even
# with gradient checkpointing (dry run on the 64 longest samples: batch 4 -> Metal OOM, batch 2 + checkpointing
# -> 9.8 GB peak). ~0.28 epoch over 16.9k pairs; ~5 h on a base M2.
iters: 2400
batch_size: 2
grad_accumulation_steps: 2
max_seq_length: 3200          # longest v4 training sample: 3,119 tokens (v3 data: max 603)
mask_prompt: true            # loss only on the assistant (PySpark) tokens
grad_checkpoint: true        # needed for v4's long samples (~40% slower); v2/v3 ran without it

num_layers: 8                # adapt the last 8 of 36 transformer blocks (16 was ~1.4x slower per step)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 1100, 1.0e-5]   # [init, decay_steps, end]

steps_per_report: 50
steps_per_eval: 600
val_batches: 50              # 100 held-out-signature samples per eval
save_every: 100               # frequent checkpoints so train_resumable.py loses little after a crash
test: false
test_batches: 200
