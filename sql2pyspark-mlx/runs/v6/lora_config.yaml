# LoRA fine-tune of Qwen2.5-Coder-7B-Instruct (4-bit MLX) on the SQL -> PySpark dataset.
# v6: the 7B model, fresh adapters (like v4, peak 1e-4) on the v5 dataset (replay-heavy mix: 55% classic families,
# 25% short v4 features, 20% pipelines). v1-v5 used Qwen2.5-Coder-3B-Instruct; v5 continued from the v4 adapters
# with half the peak learning rate (configs in runs/v2..v5/).
# Run from sql2pyspark-mlx/:   mlx_lm.lora -c lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
data: ./data                 # train.jsonl / valid.jsonl / test.jsonl from convert_sql_pyspark.py
adapter_path: ./adapters
seed: 0

# 1,200 optimizer updates of 4 samples (as v4/v5), done as 4,800 micro-batches of 1 with gradient accumulation.
# 7B dry run on the 64 longest samples (2026-09-28): batch 2 + checkpointing -> Metal OOM; batch 1 + checkpointing
# -> 9.0 GB peak, 40-50 trained tokens/s (3B: 60-70). ~8.5 h on a base M2.
iters: 4800
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200          # longest v4 training sample: 3,119 tokens (v3 data: max 603)
mask_prompt: true            # loss only on the assistant (PySpark) tokens
grad_checkpoint: true        # needed for v4's long samples (~40% slower); v2/v3 ran without it

num_layers: 8                # adapt the last 8 of 28 transformer blocks (3B: 8 of 36)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 1.0e-4          # fresh adapters: v4's schedule
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 1100, 1.0e-5]   # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 1200          # micro-batches: 4 evals (7B validation is slow)
val_batches: 100             # 100 held-out-signature samples per eval (batch 1)
save_every: 200               # frequent checkpoints so train_resumable.py loses little after a crash
test: false
test_batches: 200
