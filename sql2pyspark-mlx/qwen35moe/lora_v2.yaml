# Qwen3.5-35B-A3B round 2 (user 2026-11-16 ~01:30 "run one more training round"): continue q35moe-v1 (adapters_v1,
# 4,800 it at lr 1e-4) with a new seed (36 -> a different batch order) and half the peak lr (5e-5 -> 5e-6), another
# 4,800 micro-batches on the same data (v18a mix <= 2,600 tokens). Same LoRA layout as lora_v1.yaml.
# Run from sql2pyspark-mlx/:  .venv/bin/python train_resumable.py --config qwen35moe/lora_v2.yaml \
#                                 --launcher qwen35moe/lora_moe.py --max-restarts 20
model: mlx-community/Qwen3.5-35B-A3B-4bit
train: true
fine_tune_type: lora
data: ./qwen35moe/data_mix2600
adapter_path: ./qwen35moe/adapters_v2
resume_adapter_file: ./qwen35moe/adapters_v1/adapters.safetensors
seed: 36
iters: 4800
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 2600
mask_prompt: true
grad_checkpoint: true
num_layers: 16
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         linear_attn.in_proj_qkv, linear_attn.in_proj_z, linear_attn.in_proj_a, linear_attn.in_proj_b,
         linear_attn.out_proj,
         mlp.shared_expert.gate_proj, mlp.shared_expert.up_proj, mlp.shared_expert.down_proj]
optimizer: adamw
learning_rate: 5.0e-5
steps_per_report: 50
steps_per_eval: 400
val_batches: 25
save_every: 200
test: false
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 1180, 5.0e-6]   # [init, decay_steps, end] (optimizer updates = 4800 / 4 = 1200)
