# LoRA fine-tune for v11: v10 continued on targeted_v11 (correlated subqueries whose outer columns sit outside the key
# equality, two-subquery WHEREs, subquery + GROUP BY, select-before-set-operation, filter-after-explode; generate.py).
# Continues from v10 (classic_v10/adapters) and writes to ./targeted_v11/adapters. Settings follow v10 (7B, batch 1 x
# 4 accumulation, half LR because it continues training), with 4,000 micro-batches for the larger mix.
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config targeted_v11/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = 10,000 new targeted pairs + 5,000 pairs from classic_v10/data_mix (keeps what v10 learned)
data: ./targeted_v11/data_mix
adapter_path: ./targeted_v11/adapters
resume_adapter_file: ./classic_v10/adapters/adapters.safetensors   # v10 (candidate sql2pyspark:v10-q4)
seed: 11

# 1,000 optimizer updates of 4 samples = 4,000 micro-batches of 1 (v10: 2,400).
iters: 4000
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6-v10 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 950, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 1000
val_batches: 100
save_every: 200
test: false
test_batches: 200
