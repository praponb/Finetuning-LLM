# LoRA fine-tune for v9: the complex_v8 pairs with "mirror" window code + extra window-heavy pairs (see README.md).
# Continues from v8 (complex_v8/adapters) and writes to ./complex_v9/adapters, so the v8 adapters are never
# overwritten. Settings follow v8 (7B, batch 1 x 4 accumulation, half LR because it continues training).
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config complex_v9/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = every complex pair that uses a window (the code that changed) + 2,000 complex pairs without windows
# + 4,000 v7 pairs (keeps classic accuracy)
data: ./complex_v9/data_mix
adapter_path: ./complex_v9/adapters
resume_adapter_file: ./complex_v8/adapters/adapters.safetensors   # v8 (sql2pyspark:latest)
seed: 9

# 600 optimizer updates of 4 samples = 2,400 micro-batches of 1 (v8: 3,200).
iters: 2400
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200          # build.py drops pairs longer than 3,000 tokens
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6-v8 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 550, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 200
test: false
test_batches: 200
