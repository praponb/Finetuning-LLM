# LoRA fine-tune for v16: v15 continued on complex_v16 (10,000 complex pairs - multi-stage pipelines, many-window
# queries, set operations, gaps-and-islands, FULL OUTER joins, grouping sets, pivot / unpivot - on the synthetic
# schema_v15 catalog, + schema_v15 / targeted_v14 / classic / complex_v9 / targeted_v12 / v11 replay; build.py).
# Continues from v15 (schema_v15/adapters) and writes ./complex_v16/adapters. The complex pairs are ~3x longer than
# v15's mix, so 3,600 micro-batches (~10 h) instead of 4,800.
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config complex_v16/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = 10,000 new complex + 2,500 schema_v15 + 1,500 targeted_v14 + 708 classic scalar + 3,300 classic + 1,500 complex_v9 + 800 v12 + 700 v11
data: ./complex_v16/data_mix
adapter_path: ./complex_v16/adapters
resume_adapter_file: ./schema_v15/adapters/adapters.safetensors   # v15 (the recommended candidate)
seed: 16

# 900 optimizer updates of 4 samples = 3,600 micro-batches of 1.
iters: 3600
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6-v15 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 850, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 900
val_batches: 120
save_every: 200
test: false
test_batches: 200
