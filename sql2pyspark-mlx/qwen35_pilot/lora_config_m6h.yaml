# Qwen3.5-9B run 9 on the Mac mini M6 (2026-11-12, owner: "go ahead with option#1" = targeted complex round): continues
# run 8 (adapters_m6g: holdout 59, v4 22, fixed 143, complex 82, complex-shift 111; v15-q4 complex 89) for 2,400
# iterations on data_m6h (complexmix/build.py: 5,000 unseen complex_v9 + 2,000 unseen complex_v16 + 2,000 renamed +
# 3,000 replay), lr 5e-6 -> 5e-7. Run via chain_m6h.sh.
model: ./qwen35_pilot/base_r5_fused
train: true
fine_tune_type: lora
data: ./qwen35_pilot/data_m6h
resume_adapter_file: ./qwen35_pilot/adapters_m6g/adapters.safetensors   # run 8 (14,400 iterations on this adapter in total)
adapter_path: ./qwen35_pilot/adapters_m6h
seed: 42
iters: 2400
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 16                # last 16 of 32 blocks (same as runs 6-8, required to resume)
lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 10.0                 # same as runs 6-8
optimizer: adamw
learning_rate: 5.0e-6
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 5.0e-7
  arguments: [5.0e-6, 570, 5.0e-7]    # [init, decay_steps, end]  (optimizer updates = 2,400 / 4)
steps_per_report: 50
steps_per_eval: 400
val_batches: 110
save_every: 200
test: false
