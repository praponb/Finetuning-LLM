model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./qwen35_pilot/data_mix2600
adapter_path: qwen35_pilot/adapters_resume150
seed: 35
iters: 250
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 2600
mask_prompt: true
grad_checkpoint: true
num_layers: 8
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
optimizer: adamw
learning_rate: 0.0001
lr_schedule:
  name: cosine_decay
  arguments:
  - 8.14503363531613e-05
  - 62
  - 1.0e-05
steps_per_report: 20
steps_per_eval: 400
val_batches: 25
save_every: 25
test: false
resume_adapter_file: qwen35_pilot/adapters/0000150_adapters.safetensors
