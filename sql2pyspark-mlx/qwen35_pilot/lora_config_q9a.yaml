# Qwen3.5-9B QLoRA, fresh start "q9a" (owner 2026-11-17: discard Qwen3.5-35B-A3B, switch to Qwen3.5-9B + QLoRA,
# fresh from base). QLoRA = LoRA on the 4-bit base mlx-community/Qwen3.5-9B-4bit (as in runs 1-9).
# Why fresh: runs 3-9 were hit by the resume-seed bug (every restarted segment re-trained the start of the same batch
# order; fixed in train_resumable.py on 2026-11-15: seed + 1000 * segment), so much of their data was never seen.
# Adapter shape = run 6 (16 of 32 layers, rank 32, scale 10: stable; scale 20 + lr 5e-5 diverged in run 6 attempt 1).
# Data: data_q9a = the whole v17/v18a mix (29,008) with 8,000 pairs renamed (namecopy/build.py --keep all --seed 2028).
# 9,600 micro-batches = 2,400 optimizer updates (about 1/3 epoch); runs 1-8 reached ~21k iterations in total.
# Run via chain_q9a.sh.
model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./qwen35_pilot/data_q9a
adapter_path: ./qwen35_pilot/adapters_q9a
seed: 43
iters: 9600
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 16                # last 16 of 32 blocks
lora_parameters:
  rank: 32
  dropout: 0.05
  scale: 10.0
optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 2350, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates = 9,600 / 4 = 2,400)
steps_per_report: 50
steps_per_eval: 400
val_batches: 60
save_every: 200
test: false
