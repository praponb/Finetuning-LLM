# Pilot step 2: memory test of Qwen3.5-9B-4bit LoRA on the 64 longest v15-mix samples (make_long_set.py).
# Same LoRA settings as v6-v15 except the layer count is 8 of 32. Pass: peak <= 12.5 GB.
# Run from sql2pyspark-mlx/ with Ollama and Docker stopped:
#   MLX_MAX_OPS_PER_BUFFER=2 MLX_MAX_MB_PER_BUFFER=40 .venv/bin/mlx_lm.lora -c qwen35_pilot/memtest.yaml
model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./qwen35_pilot/data_long
adapter_path: ./qwen35_pilot/adapters_memtest
seed: 0
iters: 50
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 8
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
optimizer: adamw
learning_rate: 1.0e-4
steps_per_report: 5
steps_per_eval: 1000
val_batches: 4
save_every: 1000
test: false
