# Qwen3.5-9B pilot 2 on the Mac mini M6 32 GB (2026-11-09): does Qwen3.5 catch up with Qwen2.5-Coder-7B (v17-q4)
# when trained on the v17 mix? Continues the 2026-10-09 pilot adapters (400 iterations on the v15 mix, 41/62 hold-out)
# for 1,600 more iterations (2,000 in total). Full max_seq 3200 (the M6 has the memory: 14.6 GB peak in phase 5).
# Run via chain_m6.sh (train_resumable.py --launcher qwen35_pilot/lora_q35.py).
model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./complex_v17/data_mix  # v17 mix (29,008 train / 337 valid)
adapter_path: ./qwen35_pilot/adapters_m6
resume_adapter_file: ./qwen35_pilot/adapters/adapters.safetensors   # pilot 1 (400 iterations)
seed: 35
iters: 1600
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 8                 # last 8 of 32 blocks, as pilot 1 (required to resume its adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
optimizer: adamw
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 380, 1.0e-5]    # [init, decay_steps, end]  (optimizer updates = 1,600 / 4)
steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 100
test: false
