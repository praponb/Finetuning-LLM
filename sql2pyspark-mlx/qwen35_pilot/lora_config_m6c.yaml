# Qwen3.5-9B run 4 on the Mac mini M6 (2026-11-09, owner: "continue to use Qwen 3.5"): continues run 3
# (adapters_m6b, 6,800 iterations, hold-out 44 with table-name misspellings after the jump back to lr 1e-4) for
# 4,800 more iterations on the v17 mix at a lower peak lr 3e-5 (11,600 in total). Run via chain_m6c.sh.
model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./complex_v17/data_mix  # v17 mix (29,008 train / 337 valid)
adapter_path: ./qwen35_pilot/adapters_m6c
resume_adapter_file: ./qwen35_pilot/adapters_m6b/adapters.safetensors   # run 3 (6,800 iterations in total)
seed: 37
iters: 4800
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 8                 # last 8 of 32 blocks (required to resume the pilot adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
optimizer: adamw
learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [3.0e-5, 1150, 3.0e-6]    # [init, decay_steps, end]  (optimizer updates = 4,800 / 4)
steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 200
test: false
