# Qwen3.5-9B run 3 on the Mac mini M6 (2026-11-09, owner: "continue with Qwen 3.5"): continues pilot 2
# (adapters_m6, 2,000 iterations in total, hold-out 51/62) for a v17-sized 4,800 iterations on the v17 mix
# (6,800 in total). Run via chain_m6b.sh (train_resumable.py --launcher qwen35_pilot/lora_q35.py).
model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./complex_v17/data_mix  # v17 mix (29,008 train / 337 valid)
adapter_path: ./qwen35_pilot/adapters_m6b
resume_adapter_file: ./qwen35_pilot/adapters_m6/adapters.safetensors   # pilot 2
seed: 36
iters: 4800
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 8                 # last 8 of 32 blocks (required to resume the pilot adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
optimizer: adamw
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [1.0e-4, 1150, 1.0e-5]    # [init, decay_steps, end]  (optimizer updates = 4,800 / 4)
steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 200
test: false
