model: mlx-community/Qwen3.5-9B-4bit
train: true
fine_tune_type: lora
data: ./qwen35_pilot/data_q9g
adapter_path: ./qwen35_pilot/q9g/memtest_adapters
resume_adapter_file: ./qwen35_pilot/adapters_q9g_init/adapters.safetensors
seed: 48
iters: 50
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true
grad_checkpoint: true
num_layers: 16
lora_parameters:
  rank: 96
  dropout: 0.05
  scale: 10.0
optimizer: adamw
learning_rate: 1.0e-05
lr_schedule:
  name: cosine_decay
  warmup: 10
  warmup_init: 1.0e-06
  arguments:
  - 1.0e-05
  - 3
  - 5.0e-07
steps_per_report: 10
steps_per_eval: 100000
val_batches: 5
save_every: 1000
test: false
