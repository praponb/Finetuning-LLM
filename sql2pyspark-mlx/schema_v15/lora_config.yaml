# LoRA fine-tune for v15: v14 continued on schema_v15 (10,000 pairs of the existing query forms on 30 synthetic domains
# with names the model has never seen, against the name drift of v13 / v14; + targeted_v14 / classic / complex_v9 /
# targeted_v12 / v11 replay; build.py). Continues from v14 (targeted_v14/adapters) and writes ./schema_v15/adapters.
# Settings as v14 (7B, batch 1 x 4 accumulation, half LR, 4,800 micro-batches).
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config schema_v15/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = 10,000 new + 3,000 targeted_v14 + 708 classic scalar + 5,300 classic + 3,500 complex_v9 + 1,500 v12 + 1,000 v11
data: ./schema_v15/data_mix
adapter_path: ./schema_v15/adapters
resume_adapter_file: ./targeted_v14/adapters/adapters.safetensors   # v14 (keeps the subquery fixes)
seed: 15

# 1,200 optimizer updates of 4 samples = 4,800 micro-batches of 1 (as v14).
iters: 4800
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6-v14 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 1150, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 800
val_batches: 150
save_every: 200
test: false
test_batches: 200
