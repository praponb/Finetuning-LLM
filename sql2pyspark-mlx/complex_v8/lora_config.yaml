# LoRA fine-tune on the complex_v8 dataset (10,000 new verified complex SQL -> PySpark pairs).
# Continues from the current latest model (v7 = ./adapters) and writes to ./complex_v8/adapters, so the v7 adapters
# are never overwritten. Settings follow v7 (7B, batch 1 x 4 accumulation, half LR because it continues training).
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config complex_v8/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = the 10,000 new pairs + 7,000 v7 pairs (keeps classic accuracy; v4 lost 12 classic queries without them)
# use ./complex_v8/data for the 10,000 new pairs only
data: ./complex_v8/data_mix
adapter_path: ./complex_v8/adapters
resume_adapter_file: ./adapters/adapters.safetensors   # v7 (sql2pyspark:latest)
seed: 8

# 800 optimizer updates of 4 samples = 3,200 micro-batches of 1 (v7: 2,400). data_mix samples average ~881 tokens
# (v7 data: ~486) -> ~12 h on a base M2 (v7 took ~5 h). iters: 2400 -> ~9 h.
iters: 3200
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200          # build.py drops pairs longer than 3,000 tokens
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6/v7 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 750, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 200
test: false
test_batches: 200
