# LoRA fine-tune for v12: v11 continued on targeted_v12 (OR / mixed AND-OR conditions in every targeted family + the
# or_where family, plus replay of every classic OR pair, classic, complex_v9 and targeted_v11 pairs; build.py).
# Continues from v11 (targeted_v11/adapters) and writes to ./targeted_v12/adapters. Settings follow v10 (7B, batch 1 x
# 4 accumulation, half LR because it continues training), 2,400 micro-batches.
# Run from sql2pyspark-mlx/ (stop Docker and unload Ollama models first - 16 GB M2):
#   .venv/bin/python train_resumable.py --config targeted_v12/lora_config.yaml
model: mlx-community/Qwen2.5-Coder-7B-Instruct-4bit
train: true
fine_tune_type: lora
# data_mix = 4,700 new pairs with OR + 976 classic OR pairs + 2,800 classic + 2,500 complex_v9 + 2,000 targeted_v11
data: ./targeted_v12/data_mix
adapter_path: ./targeted_v12/adapters
resume_adapter_file: ./targeted_v11/adapters/adapters.safetensors   # v11 (sql2pyspark:latest = v11-q4 on the Mac)
seed: 12

# 600 optimizer updates of 4 samples = 2,400 micro-batches of 1 (as v9 / v10).
iters: 2400
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 3200
mask_prompt: true             # loss only on the assistant (PySpark) tokens
grad_checkpoint: true

num_layers: 8                 # last 8 of 28 blocks, same as v6-v11 (required to resume their adapters)
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0

optimizer: adamw
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-6
  arguments: [5.0e-5, 550, 5.0e-6]    # [init, decay_steps, end]  (optimizer updates)

steps_per_report: 50
steps_per_eval: 800
val_batches: 100
save_every: 200
test: false
test_batches: 200
